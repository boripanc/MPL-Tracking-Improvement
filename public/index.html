<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPI Error Center</title>
<link rel="stylesheet" href="styles.css">
<script src="vendor/chart.umd.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1>CPI Error Center</h1>
  <nav id="tabs">
    <button data-t="dash" class="on">Dashboard</button>
    <button data-t="errors">Errors</button>
    <button data-t="known">Known errors &amp; solutions</button>
    <button data-t="cats">Categories</button>
    <button data-t="tickets">Ticket pulse<span class="badge" id="tk-badge" title="Overdue tickets" hidden></span></button>
    <button data-t="certs">Certificates<span class="badge" id="cert-badge" title="Expired or expiring soon" hidden></span></button>
  </nav>
  <div class="sp"></div>
  <select id="range" aria-label="Period">
    <option value="24h">Last 24 hours</option>
    <option value="7d" selected>Last 7 days</option>
    <option value="30d">Last 30 days</option>
    <option value="90d">Last 90 days</option>
  </select>
  <button class="btn" id="refresh">Refresh</button>
  <span class="muted small" id="polled"></span>
</header>
<main>
  <section id="v-dash"></section>
  <section id="v-errors" hidden></section>
  <section id="v-known" hidden></section>
  <section id="v-cats" hidden></section>
  <section id="v-tickets" hidden></section>
  <section id="v-certs" hidden></section>
</main>
<div class="overlay" id="ov"></div>
<aside class="drawer" id="dr" aria-live="polite"></aside>
<div class="toast" id="toast"></div>
</body>
</html>
